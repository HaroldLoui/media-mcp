[package]
name = "media-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for reading multimedia files as text (metadata + OCR + AI description)"
authors = ["hanjinfeng"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/YOUR_USERNAME/media-mcp"

[dependencies]
rmcp = { version = "1.7", features = ["transport-io", "macros", "server", "base64", "schemars"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
image = "0.25"
mime_guess = "2"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[features]
default = []
