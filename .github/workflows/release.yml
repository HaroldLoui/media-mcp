name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare artifact
        shell: bash
        run: |
          cd target/release
          case "${{ matrix.os }}" in
            windows-latest)
              7z a -tzip media-mcp-windows-x86_64.zip media-mcp.exe
              ;;
            macos-latest)
              tar czf media-mcp-macos-x86_64.tar.gz media-mcp
              ;;
            ubuntu-latest)
              tar czf media-mcp-linux-x86_64.tar.gz media-mcp
              ;;
          esac

      - name: Upload artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/media-mcp-*
