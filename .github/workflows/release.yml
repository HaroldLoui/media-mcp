name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare artifact
        shell: bash
        run: |
          cd target/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../../media-mcp-${{ matrix.os }}.zip media-mcp.exe
          else
            tar czf ../../media-mcp-${{ matrix.os }}.tar.gz media-mcp
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: media-mcp-*.zip media-mcp-*.tar.gz
