name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare artifact
        shell: bash
        run: |
          cd target/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../../media-mcp-windows-x86_64.zip media-mcp.exe
          else
            tar czf ../../media-mcp-${{ runner.os }}.tar.gz media-mcp
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            media-mcp-*
